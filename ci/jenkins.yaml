jenkins:
  systemMessage: "Water Quality Monitor - CI/CD (DevSecOps micro project)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "http://localhost:8090/"
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN:-unset}"
jobs:
  - script: >
      pipelineJob('water-quality-monitor') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL:-file:///repo}') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
